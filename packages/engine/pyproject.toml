[project]
name = "engine-core"
version = "0.0.0"
description = "Pure decision core. Folds events into state and emits commands. Zero third-party dependencies."
requires-python = ">=3.11"
# INVARIANT: workspace siblings only, no third-party. Enforced by tests/test_boundaries.py.
dependencies = ["engine-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
