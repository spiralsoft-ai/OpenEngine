[tool.uv.workspace]
# Adapters are grouped by the capability they implement, so a distribution sits
# two levels down: packages/adapters/<capability>/<vendor>.
members = ["packages/*", "packages/adapters/*/*", "apps/*"]
# `packages/adapters` is a grouping directory, not a distribution. The
# capability directories under it are the same, and `packages/*` does not reach
# them.
exclude = ["packages/adapters"]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live provider runs are deselected by default and opted into with
# `-m compatibility`, which is what the scheduled CLI compatibility workflow
# does. They need a real CLI, real credentials, and somebody else's uptime, so
# having them in the default run would make `pytest` mean "did we break
# something, or is OpenAI having a bad ten minutes?".
addopts = "-q -m 'not compatibility'"
markers = [
    "compatibility: drives a real provider CLI; scheduled rather than per-PR",
]
