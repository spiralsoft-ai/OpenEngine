name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch makes the in-flight run for that branch irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a uv release cannot change what CI means without a commit saying so.
  UV_VERSION: "0.9.28"

jobs:
  fresh-install:
    name: README fresh install
    runs-on: ubuntu-latest
    env:
      # Exercise the oldest supported interpreter instead of inheriting the
      # repository's development version from `.python-version`.
      UV_PYTHON: "3.11"
    steps:
      # Hosted runners start empty, so checkout is the fresh clone a new user
      # would begin with. Deliberately do not restore dependency caches here.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install workspace
        run: uv sync

      - name: Install web client
        run: npm --prefix apps/web install

      - name: Build web client
        run: npm --prefix apps/web run build

      - name: Run tests
        run: uv run pytest

      - name: Run OpenEngine
        shell: bash
        run: |
          set -euo pipefail
          uv run engine-web > "$RUNNER_TEMP/engine-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/config > /dev/null \
              && curl --fail --silent http://localhost:8000/ > /dev/null; then
              cat "$RUNNER_TEMP/engine-web.log"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/engine-web.log"
              echo "::error::engine-web exited before it accepted a request"
              exit 1
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/engine-web.log"
          echo "::error::engine-web did not accept a request within 30 seconds"
          exit 1

  web:
    name: web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web client
        run: npm --prefix apps/web ci

      - name: Typecheck web client
        run: npm --prefix apps/web run typecheck

      - name: Test web client
        run: npm --prefix apps/web run test

      - name: Build web client
        run: npm --prefix apps/web run build

  browser:
    # The browser tier: a real server, both provider protocols, real worktrees,
    # and a scripted CLI in place of a model. Its own job because it needs both
    # toolchains and a browser, and because a failure here means something a
    # user would have seen -- which should not be reported as a component test
    # or a Python test going red.
    name: browser end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked

      - name: Install web client
        run: npm --prefix apps/web ci

      - name: Install the browser
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Drive the interface
        run: npm --prefix apps/web run test:e2e

      # Uploaded whether the run passed or failed: the report of a green run --
      # its screenshots of each state the specs assert on -- is how somebody
      # answers "what does the approval card look like now?" without running
      # the tier again.
      - name: Upload the report (a static site -- unzip, then `npx playwright show-report <dir>`)
        # GitHub serves the artifact as a zip and will not render the HTML, so
        # it has to be downloaded and opened locally.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the traces of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
          # Diagnostics, not archives.
          retention-days: 14

  boundaries:
    # Separated from the test matrix on purpose: this job answers "did someone
    # break the architecture?", which is a different question from "did someone
    # break the code", and deserves its own red X. It is version-independent --
    # the checks are static analysis over the source tree.
    name: dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: uv.lock is current
        # Fails if a pyproject dependency was edited without relocking, which
        # would make every --locked install below silently test something else.
        run: uv lock --check

      - name: Install workspace
        run: uv sync --locked

      - name: Dependency direction holds
        # domain <- engine, ports <- runtime <- adapters, apps compose.
        # Verbose so a violation names the offending package and import.
        run: uv run pytest tests/test_boundaries.py tests/test_layout_helpers.py -v

      - name: domain and engine install on a bare interpreter
        # The strongest form of "no third-party dependencies": not "we declared
        # none" but "nothing else is present and the code still runs". Catches a
        # dependency that arrives through packaging rather than an import.
        run: |
          set -euo pipefail
          uv venv /tmp/bare
          uv pip install --python /tmp/bare/bin/python packages/domain packages/engine
          uv pip freeze --python /tmp/bare/bin/python
          installed=$(uv pip freeze --python /tmp/bare/bin/python | wc -l)
          if [ "$installed" -ne 2 ]; then
            echo "::error::expected only engine-domain and engine-core, found $installed packages"
            exit 1
          fi
          /tmp/bare/bin/python -c "
          from engine.core import decide
          from engine.domain import RunId, RunRequested, RunState, TaskId
          run, task = RunId('r'), TaskId('t')
          _, commands = decide(
              RunState(run_id=run, task_id=task),
              RunRequested(run_id=run, task_id=task, prompt='p', repository='acme/api'),
          )
          assert commands, 'engine emitted no command'
          print('core decided:', commands[0].__class__.__name__)
          "

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; one old-version failure should not hide
      # the others.
      fail-fast: false
      matrix:
        # The full range the packages claim to support via requires-python.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Set at job level so every uv command in the job agrees on the
      # interpreter. Without it, `.python-version` (3.14) would win and all four
      # matrix legs would quietly test the same thing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked

      - name: Run tests
        # The blocking tier, and everything in it is deterministic: protocol
        # fixtures, normalization, the HTTP surface, and end-to-end approval
        # runs against fake CLIs that speak the real wire protocols. Live
        # provider runs are marked `compatibility` and deselected here -- they
        # are `cli-compatibility.yml`, on a schedule, because an authentication
        # or rate-limit failure is not a regression in this repository.
        run: uv run pytest

      - name: Composition roots start
        # Cheap smoke test that the capability graph still wires up: these are
        # the only places adapters are named, and a bad constructor signature
        # would not otherwise fail a test.
        # `engine-web` would start a server, so it gets `--check`: compose,
        # report, exit.
        run: |
          uv run engine-control-server
          uv run engine-worker
          uv run engine-web --check
